<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}StayNow{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .header {
            background-color: #0d6efd;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .content {
            padding: 40px 30px;
            color: #4b5563;
            line-height: 1.7;
            font-size: 16px;
        }
        .footer {
            background-color: #f9fafb;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            padding: 20px 30px;
            border-top: 1px solid #e5e7eb;
        }
        .text-bold {
            color: #111827;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>StayNow</h1>
        </div>
        <div class="content">
            {% block email_content %}
            {% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 StayNow - Nền tảng Đặt phòng Khách sạn Hàng đầu.<br>Vui lòng không trả lời email này.</p>
        </div>
    </div>
</body>
</html>
